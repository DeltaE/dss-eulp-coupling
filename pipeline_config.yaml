# Method parameters. run_case.py passes the run values (state, season, paths) as PIPELINE_* variables.
random_seed: 555

# Optional: circuits to skip during instantiation (phase 7)
# Use circuit_id integers from feeder_registry.json
skip_circuits: []

quota:
  min_per_type: 1
  redistribution: proportional
  residential_order: auto
  commercial_order: auto

# EULP releases on the OEDI data lake that Phase 5a downloads from. Each release sits in
# the OEDI folder
# https://oedi-data-lake.s3.amazonaws.com/nrel-pds-building-stock/end-use-load-profiles-for-us-building-stock/<year>/<release>/
# with <year> from residential_year or commercial_year.
# The current releases are 2024 resstock_tmy3_release_2 and 2024 comstock_amy2018_release_1.
# They keep today's folder names.
# For another residential release, Phase 1 reads Metadata_<ST>_Residential_<year>_<release>
# under eulp_metadata_root and stops when that folder is missing.
# Phase 5a then writes, and Phases 5b and 5d read,
# parquet_residential_short_<date>_<ST>_<year>_<release>.
# For another commercial release, the folders are Metadata_<ST>_Commercial_<year>_<release>
# and parquet_commercial_<date>_comm_<ST>_<year>_<release>.
eulp_release:
  residential: resstock_tmy3_release_2
  commercial: comstock_amy2018_release_1
  residential_year: 2024
  commercial_year: 2024

# PV and storage hosts (Phase 7b), sizes and storage control (Phase 7 deploy).
# Residential hosts are loads whose yearly loadshapes all start res_, commercial hosts
# those whose loadshapes all start com_. The mixes file sets the share of each segment
# that carries PV and storage (pv_res_perc, pv_com_perc, storage_res_perc,
# storage_com_perc).
der_sizing:
  # true: the segment gets PV or storage hosts as its mix share says. false: none.
  pv_residential: true
  pv_commercial: true
  storage_residential: true
  storage_commercial: true
  # Where a segment's storage hosts are drawn. with_pv: among its PV hosts first, then
  # among its other loads when storage needs more hosts than PV has. independent: among
  # all its loads. apart: among its loads without PV (all its loads when none is left).
  # ASSUMPTION: storage sits with PV (with_pv), for every case. Batteries in distributed
  # systems are mostly installed with PV: LBNL, Distributed Solar and Storage 2025 Data
  # Update, slide 6, counts attachment rates as the "Percent of new PV installs paired
  # with storage" and notes they do not capture "stand-alone storage installations",
  # and its storage sizes (slide 7) are those of paired systems:
  # https://emp.lbl.gov/sites/default/files/2025-10/Distributed%20Solar%20%26%20Storage-2025%20Data%20Update.pdf
  # independent or apart moves batteries to loads without PV, where they charge from
  # the grid only.
  storage_hosts: with_pv
  # low, moderate or high: the entry each low/moderate/high parameter below takes. low
  # gives the smaller PV and storage.
  sizing_case: moderate
  # PV size rule per segment. roof_and_use: PV kW (DC) = min(roof coverage x roof m2 x
  # module kW per m2, annual use share x annual use kWh / annual yield kWh per kW); the
  # yield is the year of the donor's SMART-DS solar file (pv_profile in
  # configs/donor_registry.yaml). Storage kW = storage_kw_per_pv_kw x that PV kW (also
  # at a storage host without PV), kWh = storage_hours x kW. peak_ratio: the peak
  # ratios and minimums below, for PV and storage.
  pv_rule_residential: roof_and_use
  pv_rule_commercial: roof_and_use
  # Roof area. floor_stories: floor area (in.sqft) over stories (in.geometry_stories for
  # homes, in.number_of_stories for commercial buildings), divided by the cosine of the
  # residential roof tilt for homes and flat for commercial buildings, as LBNL
  # approximates roof area for its coverage shares. metadata: the building model's roof
  # column (out.params.roof_area_ft_2 for homes, out.params.ext_roof_area..m2 for
  # commercial buildings).
  roof_area_source: floor_stories
  # Commercial coverage rule. lbnl: the commercial roof_coverage below on the roof of
  # roof_area_source. comstock: comstock_roof_coverage x the metadata roof x
  # comstock_kw_per_m2 (the ComStock rule, on the roof it is defined on), with the use
  # cap kept.
  coverage_rule_commercial: lbnl
  residential:
    # LBNL, Distributed Solar and Storage 2025 Data Update, slide 24, note: "We
    # approximate roof area using data from CoreLogic on the ground-floor square footage
    # of each building, adjusted based on actual or assumed roof tilt (20 degrees for
    # residential and flat roof for non-residential)." URL above.
    roof_tilt_deg: {value: 20.0}
    # LBNL 2025 Data Update, slide 24: "Residential roof-coverage ratios typically
    # ranged from 16-41% of total roof area in 2024 (across the percentile band shown)",
    # median 25% ("from 29% to 25% for residential").
    roof_coverage: {low: 0.16, moderate: 0.25, high: 0.41}
    # LBNL, Evaluating the Potential for PV plus Storage to Provide Backup Power
    # (October 2023 webinar), slide 9: "Base-case for single-family and mobile homes
    # assumes PV systems sized to generate 100% of annual energy consumption",
    # "Sensitivities with PV systems based on 50% of annual energy consumption":
    # https://emp.lbl.gov/sites/default/files/2024-03/pvess_report_october_6_webinar.pdf
    # ASSUMPTION: the share applies to the building's baseline annual electricity use
    # (out.electricity.total.energy_consumption.kwh, before any heat pump or EV), for
    # every home, as an installer sizes PV on past bills; a home in the dm or un group
    # keeps the PV of its baseline building. Sizing on the upgraded use would raise PV
    # at heat pump homes where the roof does not bind.
    annual_use_share: {low: 0.5, moderate: 1.0, high: 1.0}
    # LBNL 2025 Data Update, slide 5: module efficiencies had "a median of roughly 21%
    # and a percentile range of 20.5-21.5% (for residential)"; 1 kW/m2 at standard test
    # conditions gives kW per m2 equal to the efficiency.
    module_kw_per_m2: {low: 0.205, moderate: 0.21, high: 0.215}
    # Inverter kVA = Pmpp / inverter loading ratio. LBNL 2025 Data Update, slide 25:
    # median ILRs "are now roughly equivalent across sectors (ranging from 1.23-1.25)".
    # LBNL backup study, slide 39: "1.2 inverter loading ratio" (NREL SAM defaults).
    # low (smaller inverter) 1.25, high (larger inverter) 1.20.
    inverter_loading_ratio: {low: 1.25, moderate: 1.24, high: 1.20}
    # LBNL 2025 Data Update, slide 7: "For residential and small non-res. systems,
    # storage kW capacity was roughly equal to the paired PV capacity".
    storage_kw_per_pv_kw: {value: 1.0}
    # LBNL 2025 Data Update, slide 7: "Across all three customer segments, median storage
    # duration was 2 hours", with "at least 20% of paired systems having 4+ hours" among
    # large non-residential systems; NREL ATB 2024 uses "the capacity factor for a
    # 4-hour device as the default":
    # https://atb.nlr.gov/electricity/2024/commercial_battery_storage
    storage_hours: {low: 2.0, moderate: 2.0, high: 4.0}
    # Standby power of one home battery system in W (storage_standby_case picks the
    # entry). Orth et al., Efficiency characterization of 26 residential photovoltaic
    # battery storage systems, Journal of Energy Storage 65 (2023) 107299,
    # https://doi.org/10.1016/j.est.2023.107299, section 2.6, Fig. 16 and Tables VIII and
    # IX, lab tests of German systems with the battery discharged: "the lowest standby
    # consumption is only 2 W (B1 and B3). On average, the power consumption is 18 W and
    # the median is even lower at 12 W"; the highest is 71 W (L2). low 2 (lowest),
    # moderate 12 (median), high 71 (highest).
    # ASSUMPTION: every home battery draws its discharged-state standby power at every
    # step of the day, since a system "remains discharged between 2000 h and 4000 h per
    # year" and "spends only 1000 h to 2000 h per year in a fully charged state"
    # (section 2.6), where the same tests give 1 to 45 W (median 5 W). A higher value
    # draws more grid power at every home battery all day. The deploy writes it as
    # %IdlingkW = 100 x W / (1000 x the host's storage kW).
    storage_standby_w: {low: 2.0, moderate: 12.0, high: 71.0}
  commercial:
    # LBNL 2025 Data Update, slide 24: "Roof-coverage ratios for non-residential systems
    # varied more widely, from 15-66%", median 32% ("from 37% to 32% for
    # non-residential").
    roof_coverage: {low: 0.15, moderate: 0.32, high: 0.66}
    # LBNL backup study, slide 27: "PV sizing: Assume PV is sized to generate 100% of
    # annual consumption subject to roof-area constraint"; 50 % as for homes (slide 9).
    # ASSUMPTION: the share applies to the building's baseline annual electricity use
    # (out.electricity.total.energy_consumption, kWh), for every commercial host, as an
    # installer sizes PV on past bills. Sizing on the upgraded use would raise PV where
    # the roof does not bind.
    annual_use_share: {low: 0.5, moderate: 1.0, high: 1.0}
    # LBNL 2025 Data Update, slide 5: "Module efficiencies were similar across customer
    # segments, with a median of roughly 21%". CaraDonna, ComStock Measure Documentation:
    # Photovoltaics With 40% Rooftop Coverage, NREL/TP-5500-95004 (2025), section 3.2.1:
    # "Panel efficiency is 21%, which corresponds to 210 W/m2":
    # https://docs.nlr.gov/docs/fy25osti/95004.pdf
    module_kw_per_m2: {low: 0.21, moderate: 0.21, high: 0.21}
    # LBNL 2025 Data Update, slide 25 (medians 1.23-1.25). CaraDonna 2025, Table 1:
    # "DC/AC Ratio 1.10". low (smaller inverter) 1.25, high (larger inverter) 1.10.
    inverter_loading_ratio: {low: 1.25, moderate: 1.24, high: 1.10}
    # LBNL 2025 Data Update, slide 7: storage kW roughly equal to PV kW for small
    # non-residential systems; "large non-res. systems had smaller batteries relative
    # to their PV capacity (a median kW ratio of 0.5)". Slide 15: "Small vs. Large
    # Non-Residential, based on a cutoff of 100 kWDC", applied to the host's PV kW.
    storage_kw_per_pv_kw_small: {value: 1.0}
    storage_kw_per_pv_kw_large: {value: 0.5}
    large_pv_kw: {value: 100.0}
    storage_hours: {low: 2.0, moderate: 2.0, high: 4.0}
    # CaraDonna 2025, Table ES-1: "Total panel area is modeled at 40% of the roof area
    # for each model", 21 % efficiency; section 5.1: 8,750 ft2 of roof gives 68 kW.
    comstock_roof_coverage: {value: 0.40}
    comstock_kw_per_m2: {value: 0.21}
    # ASSUMPTION: a commercial battery draws 0.24 % of its rated kW as standby power
    # (low 0.04 %, high 1.42 %), at every step, for every commercial storage system: the
    # home standby of Orth et al. 2023 (storage_standby_w above, 2, 12 and 71 W) over a
    # 5 kW system, since "In almost half of the systems, the nominal discharge power is
    # less than 5 kW" (section 2.2). It scales the home measurements to the battery's
    # rating. Public comparisons: two utility-scale lithium-ion systems drew a mean
    # auxiliary power of 0.004 and 0.011 kW per rated kW while operating, cooling and
    # heating included (Crawford et al., PNNL-29378, 2020, Table 6.2,
    # https://www.osti.gov/servlets/purl/1602252); a 60 kW lead-acid system showed
    # standby losses of 414 to 452 W at rest, 0.69 to 0.75 % (Rose, Schenkman and
    # Borneo, SAND2013-8849, 2013, Table 1, https://www.osti.gov/servlets/purl/1115242).
    # A higher value draws more grid power at every commercial battery all day.
    storage_standby_pct_of_kw: {low: 0.04, moderate: 0.24, high: 1.42}
  # ASSUMPTION: every PVSystem turns on above 0.1 % and off below 0.1 % of its inverter
  # kVA (%Cutin, %Cutout), so the array produces whenever the sun is up. The SMART-DS
  # PV files of the donor feeders use the same values, for example
  # https://oedi-data-lake.s3.amazonaws.com/SMART-DS/v1.0/2018/GSO/urban-suburban/scenarios/solar_high_batteries_high_timeseries/opendss/uhs13_1247/uhs13_1247--udt4015/PVSystems.dss
  # The OpenDSS default is 20 % for both (PVsystem.pas, FpctCutIn := 20.0):
  # https://sourceforge.net/p/electricdss/code/4176/tree/trunk/Version8/Source/PCElements/PVsystem.pas
  # A higher value removes output in the early morning and late afternoon.
  pv_cutin_pct: 0.1
  pv_cutout_pct: 0.1
  # ASSUMPTION: every battery inverter is rated kVA = kW / 0.90, for every storage
  # system, so it can give reactive power at full real power down to a power factor of
  # 0.90. The SMART-DS storage files of the donor feeders use kVA = 1.1 x kW (8.8 kVA
  # for 8 kW), for example
  # https://oedi-data-lake.s3.amazonaws.com/SMART-DS/v1.0/2018/GSO/urban-suburban/scenarios/solar_high_batteries_high_timeseries/opendss/uhs13_1247/uhs13_1247--udt4015/Storage.dss
  # A lower value raises the inverter kVA.
  storage_pf: 0.90
  # Charge and discharge efficiency, percent. The SMART-DS storage files above use
  # %EffCharge=95.0 %EffDischarge=95.0, a round trip of 90.25 %. NREL ATB 2024 adopts a
  # round-trip efficiency of 85 % (URL above); the OpenDSS default is 90 % each. A lower
  # value loses more energy between charge and discharge.
  storage_eff_charge_pct: 95.0
  storage_eff_discharge_pct: 95.0
  # ASSUMPTION: every battery starts the day holding 20 % of its kWh, equal to the
  # reserve, so it charges before it discharges, and the tuned and schedule rules aim
  # to end the day where it started, so a one-day run borrows no energy from the day
  # before. SMART-DS storage files start at 50 % (kWhStored=8.0 of 16.0); the OpenDSS
  # default is 100 % (Storage.pas, URL below). A higher start lets a battery discharge
  # before it charges. Under schedule_start: best the schedule rule replaces it for its
  # batteries.
  storage_start_pct: 20.0
  # best or fixed: the starting energy of the batteries under storage_rule: schedule.
  # fixed: every battery starts at storage_start_pct. best: for each host the schedule
  # rule tries every start of schedule_start_step_pct and keeps the one whose plan
  # leaves the lowest forecast maximum on its view; the host's batteries start and end
  # the day at that energy. The other rules keep storage_start_pct.
  schedule_start: best
  # ASSUMPTION: under schedule_start: best, the starts tried for every host are every
  # 10 % of kWh from storage_reserve_pct to 100 % (20, 30, ..., 100 with the defaults).
  # A finer step finds a start closer to the best and takes longer to run.
  schedule_start_step_pct: 10.0
  # ASSUMPTION: no battery discharges below 20 % of its kWh, for every storage system,
  # which keeps energy for backup. This is the OpenDSS default %reserve of a Storage
  # element ("Default = 20", Storage.pas):
  # https://sourceforge.net/p/electricdss/code/4176/tree/trunk/Version8/Source/PCElements/Storage.pas
  # A higher reserve lowers the energy the battery can shift.
  storage_reserve_pct: 20.0
  # low, moderate or high: the entry of storage_standby_w (residential) and
  # storage_standby_pct_of_kw (commercial) that is the standby of every battery, drawn
  # as set by storage_standby_element. low gives the smaller standby losses.
  storage_standby_case: moderate
  # load or idling: where each battery's standby kW (storage_standby_case) is drawn.
  # load: every Storage element gets %IdlingkW=0, and a constant-power Load on the
  # battery's bus (model=1, status=fixed) draws the same standby kW at every step.
  # idling: the standby is the Storage element's %IdlingkW. OpenDSS draws %IdlingkW of
  # kWRated at every step: from the grid while idling, from the battery while
  # discharging, out of the charge while charging (Storage.pas, URL above; its default
  # is 1 %).
  # ASSUMPTION: under load, every battery's standby kW is drawn from the grid at every
  # step, also while the battery discharges, where OpenDSS takes %IdlingkW from the
  # battery ("If supplying idling losses, when discharging, the Storage supplies the
  # idling losses", Storage.pas, URL above); the difference is at most the standby kW
  # during discharge steps. The reason: an idle battery reports its %IdlingkW as a
  # negative kW, and a StorageController asks each battery for that kW plus its share
  # of the kW needed (ChargekW := PresentkW + kWNeeded * (FWeights[i]/TotalWeight) *
  # DispFactor, DoPeakShaveModeLow in StorageController.pas:
  # https://sourceforge.net/p/electricdss/code/HEAD/tree/trunk/Version8/Source/Controls/StorageController.pas),
  # so a battery whose idling draw exceeds its share keeps charging and the step does
  # not settle. With idling, the discharge covers the standby and a tuned controller
  # can stop the solve.
  storage_standby_element: load
  # peak_ratio rule (pv_rule_<segment>: peak_ratio), from the host's peak kW (the
  # maximum of its daily kW profile).
  # ASSUMPTION: storage power rating is 0.75 times the host's peak kW, for every
  # storage system in every case. It lets the battery cover most of the host's own
  # peak. A higher ratio raises storage kW and kWh and the PeakShave target.
  storage_kw_per_peak_kw: 0.75
  # ASSUMPTION: storage power rating is at least 5.0 kW, for every storage system.
  # It keeps a battery at a host with a low peak from being negligible. A higher
  # minimum raises storage kW and kWh at hosts with a low peak.
  storage_min_kw: 5.0
  # ASSUMPTION: storage energy is 4.0 hours of rated power (kWh = 4.0 x kW), for
  # every storage system. It sets how long a full battery can discharge at rated
  # power. A longer duration raises stored energy and discharge time. The NREL
  # Annual Technology Baseline 2024 bases its commercial battery storage costs on
  # 4-hour systems: https://atb.nrel.gov/electricity/2024/commercial_battery_storage
  storage_hours: 4.0
  # ASSUMPTION: PV array rating (Pmpp) is 0.30 times the host's peak kW, for every
  # PV system in every case. It sizes the array as a share of the host's demand.
  # A higher ratio raises PV output and the midday reverse flow at the host.
  pv_kw_per_peak_kw: 0.30
  # ASSUMPTION: PV array rating is at least 10.0 kW, for every PV system. It keeps
  # an array at a host with a low peak from being negligible. A higher minimum
  # raises PV output at hosts with a low peak.
  pv_min_kw: 10.0
  # How the batteries run; schedule is the default. simple: kWTarget =
  # simple_peak_fraction x the view's daily peak, kWTargetLow = simple_mean_fraction x
  # its daily mean. tuned: kWTarget at the level above which the view's curve holds the
  # usable energy of its batteries, kWTargetLow at the level below which filling the
  # curve recharges them (storage_control.py). schedule: no controller; each battery
  # follows a charge and discharge schedule computed on its view's curve. The
  # controller rules run PeakShave for discharging and PeakShaveLow for charging.
  # Targets and schedules use a forecast of the measured curve (forecast_error of the
  # ev_day value set).
  storage_rule: schedule
  # The view a battery watches. feeder: the feeder-head line (Monitor m2 of Master.dss).
  # transformer: its host's service transformer. building: the line that feeds its
  # host's bus.
  storage_view: feeder
  # after_cars: storage targets from the curve with the cars placed. before_cars: from
  # the curve without cars, and the cars' base solve holds the storage.
  # same_measurement: both from the curve without each other.
  storage_order: after_cars
  # all_placed: the measured curve holds buildings, PV and, under after_cars, the cars.
  # buildings_only: buildings only.
  storage_measure: all_placed
  # add_kw: the measured curve is a buildings-only solve plus the kW of the layers
  # placed after it. solve: an OpenDSS solve with the layers in.
  storage_layer: add_kw
  # ASSUMPTION: under simple, each controller discharges above 0.95 of its view's
  # forecast daily peak and charges below 0.80 of its forecast daily mean, for every
  # view. 0.95 leaves a discharge band of 5 % of the peak, wider than the typical
  # hour-ahead forecast error of a feeder curve (about 1.4 % at 14,563 kW,
  # forecast_error in ev_inputs.yaml), and 0.80 aims charge at the night valley. A lower
  # peak fraction discharges longer and empties the battery earlier; a higher mean
  # fraction charges longer.
  simple_peak_fraction: 0.95
  simple_mean_fraction: 0.80
  # ASSUMPTION: a circuit with storage allows up to 10000 control iterations per time
  # step (Set MaxControlIter before the Solve). A StorageController shares the kW it
  # needs over every battery of its fleet, so when most are full or empty the last ones
  # approach the target in many small steps; the SMART-DS Master.dss sets 50
  # (set maxcontroliter=50) and the OpenDSS default is 10 (Solution.pas,
  # MaxControlIterations := 10):
  # https://sourceforge.net/p/electricdss/code/4176/tree/trunk/Version8/Source/Common/Solution.pas
  # A step that needs more stops the solve and the deploy fails. A higher value only
  # lets such a step finish.
  storage_max_control_iter: 10000
  # ASSUMPTION: every StorageController holds the watched power within a band of 4 % of
  # its target (+/- 2 %), for discharging (%kWBand) and charging (%kWBandLow), in
  # every view. With the OpenDSS default of 2 % (+/- 1 %, https://opendss.epri.com/Properties25.html)
  # a fleet of many small batteries can keep stepping around the target without
  # settling, and the solve stops. A wider band leaves the watched power further from
  # its target.
  storage_kw_band_pct: 4.0
  # ASSUMPTION: every StorageController asks its fleet for half of the kW it needs in
  # each control iteration (DispFactor 0.5), in every view. The OpenDSS documentation
  # gives this damping for "maximum control iterations are exceeded due to numerical
  # instability such as fleet being set to charging and idling in subsequent control
  # iterations" (https://opendss.epri.com/Properties25.html, DispFactor); the default 1
  # disables it. A smaller value settles more slowly.
  storage_disp_factor: 0.5

# Which calendar day each mixed or stress circuit is simulated on.
# per_group: each heating group (baseline, dm, un) on its own seasonal peak day.
# per_circuit: all groups of a circuit on one day, the peak day of the circuit's
# building load. Baseline circuits use the baseline peak day under both values.
# per_circuit is the default; per_group remains available through this setting.
peak_day_rule: per_circuit

# What the heating split of Phase 7b and phase mix_days counts (heating_split.py).
# building: each building profile (yearly loadshape) of a feeder gets one heating group,
# the group counts are exact over buildings, and every customer of a building takes its
# group. customer: the counts are over customers (load names), and a building shared by
# several customers takes the group of the last one dealt (the rule before this setting).
# Main runs use the default, building.
heating_label_unit: building

# Voltage band for load voltage summaries, per unit of nominal. ANSI C84.1 Range A
# at the service point, as described in NREL/TP-5D00-77156 (2021), section 2.2:
# https://www.nrel.gov/docs/fy21osti/77156.pdf
voltage_band:
  low_pu: 0.95
  high_pu: 1.05

# How the Phase 7 deploy shapes the charging of controlled EVs.
# uncontrolled: controlled cars keep their session rows.
# valley_fill_feeder: each controlled car fills the valleys of the feeder-head load.
# valley_fill_transformer: each controlled car fills the valleys of its own service
# transformer's load (the feeder-head load when the car has no service transformer).
# offpeak_start: each controlled car starts around the cheap period of the donor
# state's saved time-of-use rate (7_circuit_instantiation/data_tariffs/).
# water_fill_feeder: each controlled car's power varies up to its limit inside its
# window, filling the valleys of the feeder-head load toward one level.
# The valley rules place controlled cars in order of plug-in time on a forecast of the
# curve they fill.
# Main runs use the default, valley_fill_feeder.
ev_control: valley_fill_feeder

# What the no-EV solve behind the valley rules holds besides the circuit.
# buildings_only: building loads only. after_pv: also PV. Under der_sizing storage_order
# before_cars the base also holds the storage.
# Main runs use the default, buildings_only.
ev_valley_base: buildings_only

# Where each EV car of the Phase 7 deploy comes from (deployer_modules/ev_cars.py).
# evwatts_sessions: each car draws one measured weekday home Level 2 session from EV
# WATTS (needs evwatts_extract_dir in configs/local.yaml).
# nhts_days: each car draws one weighted 2017 NHTS weekday vehicle-day of the donor state.
# session_rows: the repaired 2024 generator on the Team-Nando check curve (needs the
# EV WATTS extract for the share of cars charging).
# Main runs use the default, evwatts_sessions.
ev_cars: evwatts_sessions

# true: controlled charging stays inside the time the car is plugged in at home.
# false: controlled cars may charge in any interval of the day.
# Main runs use the default, true.
ev_home_window: true

# Which value set of 7_circuit_instantiation/data_ev_cars/ev_inputs.yaml the EV cars
# and their control use: the share of cars charging, the months drawn, the check
# curve, the forecast error and the start spread.
# typical: a typical weekday. stress: a stress day (every car charges, season months
# only, the 75th percentile check curve, day-ahead forecast error, a narrow start spread).
# Main runs use the default, typical.
ev_day: typical

# Share of the EV cars charging on the simulated weekday that charge at a workplace,
# a commercial load of the same circuit, and not at home: work_share in
# 7_circuit_instantiation/data_ev_cars/ev_inputs.yaml.
# low: 0, every car charges at home. moderate: 0.10. high: 0.20.
# Main runs use the default, moderate.
ev_work_share_case: moderate
