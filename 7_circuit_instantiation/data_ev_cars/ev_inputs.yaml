# Inputs of the EV cars of the Phase 7 deploy (deployer_modules/ev_cars.py) and of
# build_evwatts_extract.py. Each input holds a typical and a stress value and its
# source. The deploy reads the value set that ev_day in pipeline_config.yaml names.

# Charging power of a Level 2 home charger, kW.
level2_kw:
  typical: 7.2
  stress: 7.2
  source: "U.S. Department of Energy, Alternative Fuels Data Center: Electric Vehicle Charging Stations (most residential Level 2 chargers deliver 7.2 kW): https://afdc.energy.gov/fuels/electricity-stations"

# Charging power of a Level 1 home charger, kW.
level1_kw:
  typical: 1.0
  stress: 1.0
  source: "U.S. Department of Transportation, Level 1 charging at about 1 kW: https://www.transportation.gov/node/211431"

# Highest power of Level 2 charging equipment, kW. build_evwatts_extract.py drops the
# sessions whose mean power (energy_kwh / charge_duration) is above it.
level2_max_kw:
  typical: 19.2
  stress: 19.2
  source: "U.S. Department of Energy, Alternative Fuels Data Center: Electric Vehicle Charging Stations (a Level 2 unit can range from 2.9 to 19.2 kW power output): https://afdc.energy.gov/fuels/electricity-stations"

# kWh per mile = kwh_per_gallon_equivalent / mpge_bev, computed in ev_cars.py.
kwh_per_gallon_equivalent:
  typical: 33.7
  stress: 33.7
  source: "U.S. Environmental Protection Agency, Fuel Economy and EV Range Testing (a gallon of gasoline has the energy of 33.7 kWh of electricity): https://epa.gov/greenvehicles/fuel-economy-and-ev-range-testing"

mpge_bev:
  typical: 99.9
  stress: 99.9
  source: "U.S. Environmental Protection Agency, The 2025 EPA Automotive Trends Report, EPA-420-R-26-001, Table 4.1, average model year 2024 battery electric vehicle, 99.9 mpge: https://www.epa.gov/system/files/documents/2026-02/420r26001.pdf"
  assumption: "ASSUMPTION: every EV car uses 33.7 / 99.9 = 0.337 kWh per mile driven, in every case and season, the average of the model year 2024 new battery EVs; the cars on the feeders are of mixed model years and include larger vehicles, and a lower mpge raises the energy of every NHTS vehicle-day car and its leftover kWh."

# Share of cars that charge on the simulated weekday.
# measured: from the EV WATTS extract (ev_cars.charging_share), on the months of the
# draw pool; all: every car, and under nhts_days the NHTS pool keeps class (i) days
# only, so every car drove.
charging_share:
  typical: measured
  stress: all
  source: "EV WATTS public database, U.S. Department of Energy, https://doi.org/10.15483/1970735"
  assumption: "ASSUMPTION: each residential charger serves one car and is in service on every weekday between its first and last recorded session; s is the share of those weekdays with a session."
  # With horizon_days above 1 in pipeline_config.yaml (ev_cars.window_group, plan_car).
  # measured: day X keeps the draw of the one-day run; on every other day each car
  # charges with the measured share of the day's type, the weekend share measured on
  # the weekend extract with the same formula (used Saturdays and Sundays over
  # in-service Saturdays and Sundays). all: every car charges on every day.
  assumption_horizon: "ASSUMPTION: over a horizon of more than one day each car keeps its one drawn session and charger, and on every day other than the simulated peak day it charges with probability equal to the measured share of days of that type with a session at home chargers of its census division (for example 0.403 South Atlantic and 0.454 West South Central on weekdays, 0.384 and 0.435 on Saturdays and Sundays), drawn independently each day. Real drivers keep habits such as fixed charging days, so drawn days spread more evenly than real ones, while the expected sessions per car and the fleet energy per day equal the measured values."
  assumption_top_up: "ASSUMPTION: energy a car cannot charge inside its plug-in window on a charging day is charged on the next evening the car has no drawn session, from its own plug-in time, at its own power, inside its own window; energy still owed when the horizon ends is reported and not charged. A Level 1 car at 1.0 kW needs 10 h for a 10 kWh session, so without this rule it would receive less energy over the horizon than its sessions record; when every car charges every day (stress) no top-up occurs."

# Months of the year the cars draw from. all: every month; season: the months of the
# simulated season in season_months.
months:
  typical: all
  stress: season
  source: "EV WATTS public database, https://doi.org/10.15483/1970735; 2017 National Household Travel Survey, https://nhts.ornl.gov/assets/2016/download/Csv.zip"
  assumption: "ASSUMPTION: on a typical day cars draw EV WATTS sessions or NHTS vehicle-days of every month of the year, in summer and winter runs alike, so the draw pools hold every recorded weekday; the stress day draws from the simulated season only, which follows seasonal travel and charging more closely with fewer rows and moves plug-in times, energies and the share of cars charging."

# Check curve of ev_cars: session_rows, under data_ev/ (a copy of the Team-Nando files).
check_curve:
  folder: data_ev/without_daily_plug_in_factor
  typical: "Weekday - Level 2 - Diversified (Median) of 100 EVs.csv"
  stress: "Weekday - Level 2 - Diversified (75th percentile) of 100 EVs.csv"
  source: "Team-Nando, EV-Demand-Profiles, at commit 348e1413753ed21c10535706ed8fc3cb5bab0ec9: https://github.com/Team-Nando/EV-Demand-Profiles/tree/348e1413753ed21c10535706ed8fc3cb5bab0ec9"
  assumption: "ASSUMPTION: under session_rows each charging car takes the daily energy per plugged-in EV of the Team-Nando weekday Level 2 diversified curve without a daily plug-in factor (21.48 kWh for the median of 100 EVs); the curve comes from UK home charging and serves as a check on the measured US sources, and a higher curve raises the energy of every charging car."

# Census division of each donor state; EV WATTS records the division of each charger, not its state.
census_division:
  typical:
    NC: South Atlantic
    TX: West South Central
  stress:
    NC: South Atlantic
    TX: West South Central
  source: "U.S. Department of Energy, Table 2: U.S. Geographic Areas and Census Regions: https://www.energy.gov/fecm/articles/table-2-us-geographic-areas-and-census-regions"
  assumption: "ASSUMPTION: NC cars draw EV WATTS sessions of chargers in the South Atlantic division and TX cars of chargers in the West South Central division, because EV WATTS gives no state; the division's other states (for example Florida and Georgia, or Oklahoma and Louisiana) shape the sessions, and a state-level source would move plug-in times, energies and the share of cars charging."

# Months of each simulated season, used when months is season (month numbers 1 to 12).
season_months:
  typical:
    summer: [6, 7, 8]
    winter: [12, 1, 2]
  stress:
    summer: [6, 7, 8]
    winter: [12, 1, 2]
  source: "NOAA National Centers for Environmental Information, Meteorological Versus Astronomical Seasons (meteorological summer includes June, July and August; meteorological winter includes December, January and February): https://www.ncei.noaa.gov/news/meteorological-versus-astronomical-seasons"
  assumption: "ASSUMPTION: when months is season, a summer run draws only the EV WATTS sessions and NHTS vehicle-days of June, July and August and a winter run only those of December, January and February, the meteorological seasons of the Northern Hemisphere (NOAA); other months for a season would change the draw pools, and with them the plug-in times, the energies and the share of cars charging."

# Forecast error of the aggregator under the valley rules. The model gives the relative
# RMS error CV (percent) of a forecast of a curve whose mean load is W (kWh per hour):
# hour_ahead CV = sqrt(a^2 / W^b + c^2); day_ahead CV = sqrt(a / W + c).
forecast_error:
  typical: hour_ahead
  stress: day_ahead
  models:
    hour_ahead: {a: 54.4, b: 0.91, c: 1.19}
    day_ahead: {a: 3562, c: 41.9}
  source: "Sevlian, R. and Rajagopal, R., A Scaling Law for Short Term Load Forecasting on Varying Levels of Aggregation, arXiv:1404.0058v3 (2017), Table 2, model M3 (one hour ahead), and equation 10 (day ahead): https://arxiv.org/abs/1404.0058v3"
  assumption: "ASSUMPTION: the aggregator places controlled cars on a forecast of each curve it fills, with a normal error drawn once per hour and held over the four intervals of that hour, independent from hour to hour, of relative RMS size CV from the one-hour-ahead model on a typical day and the day-ahead model on a stress day (3.4 and 7.0 percent of a 500 kW mean load, 14.0 and 14.8 percent of a 20 kW mean load); real forecast errors are correlated over hours, and a larger error moves controlled charging away from the true valleys."

# Standard deviation of the start of an offpeak_start car around the start of the
# cheap period, minutes.
start_spread_min:
  typical: 60
  stress: 15
  source: "Uplight, What Does EV Charging Data Tell Us About TOU Program Effectiveness? (users often start charging right at the beginning of the off-peak period, often within the first minute): https://uplight.com/blog/what-does-ev-charging-data-tell-us-about-tou-program-effectiveness/"
  assumption: "ASSUMPTION: cars on a time-of-use schedule set their start around the start of the cheap period, normally distributed with a standard deviation of 60 minutes on a typical day and 15 minutes on a stress day, when more cars start at the same moment; field data show many users start charging at the beginning of the off-peak period (Uplight), and a narrower spread raises the fleet's peak at that moment. A scheduled car starts at the later of its schedule time and its plug-in time, so a car plugged in after its schedule time starts at once, not the next day."

# Share of the EV cars charging on the simulated weekday that charge at a workplace
# (a commercial load of the same circuit) and not at home; ev_work_share_case in
# pipeline_config.yaml picks the case. The same menu holds on typical and stress days.
work_share:
  typical: {low: 0.0, moderate: 0.10, high: 0.20}
  stress: {low: 0.0, moderate: 0.10, high: 0.20}
  source: "EVI-Pro Lite daily-load-profile API, U.S. Department of Energy (weekday energy at work over energy at home and at work, 30,000 battery EVs, every car with home charging; 0.095 when every car prefers home, 0.212 when 60 percent prefer home): https://doi.org/10.15483/1855624; Idaho National Laboratory, Plugged In: How Americans Charge Their Electric Vehicles, INL/EXT-15-35584 (2015), Figure 3 (87 percent of Volt and 84 percent of Leaf charging at home) and Figure 7 (32 and 39 percent of charging at work for drivers with home and workplace charging): https://inldigitallibrary.inl.gov/sites/sti/sti/7323604.pdf"
  assumption: "ASSUMPTION: under moderate, 10 percent of the EV cars that charge on the simulated weekday charge at a workplace and the other 90 percent at home, rounded from EVI-Pro Lite's 9.5 percent of home and work energy at work when every car has home charging and prefers it, and above the 84 and 87 percent of charging done at home by the drivers INL studied; high (20 percent) is rounded from EVI-Pro Lite's 21.2 percent when 60 percent prefer home, and low (0) keeps every car at home. The share is tunable: a higher share moves charging from evenings at homes to mornings at commercial loads. Public charging is not modelled, so the share divides charging between home and work only."

# Extract files the cars draw from on the weekend days (Saturday and Sunday) of a
# horizon of more than one day (horizon_days in pipeline_config.yaml above 1); a
# one-day run reads none of them. evwatts_residential: in evwatts_extract_dir
# (build_evwatts_extract.py --day-type weekend). nhts: in this folder
# (build_nhts_extract.py --day-type weekend; {state} is the donor state).
# Each car draws one weekend session or vehicle-day once and keeps it for every weekend
# day of the window, as it keeps its weekday one. Work cars charge at home on weekend
# days. The office weekend extract (build_evwatts_extract.py --venue office --day-type
# weekend) is read by no run; it gives the weekend shares of the assumption below.
weekend_files:
  typical: {evwatts_residential: evwatts_residential_l2_weekend.csv, nhts: "{state}_nhts2017_vehicle_days_weekend.csv"}
  stress: {evwatts_residential: evwatts_residential_l2_weekend.csv, nhts: "{state}_nhts2017_vehicle_days_weekend.csv"}
  source: "EV WATTS public database, U.S. Department of Energy, https://doi.org/10.15483/1970735; 2017 National Household Travel Survey, https://nhts.ornl.gov/assets/2016/download/Csv.zip"
  assumption: "ASSUMPTION: workplace charging happens on weekdays only. EV WATTS Business Office Level 2 chargers record a session on 11 to 14 percent of Saturdays and Sundays in service against 30 to 32 percent of weekdays, and a weekend charger-day takes about a third of a weekday's energy. Shares of the days between a charger's first and last session that have a session, from the office extracts: South Atlantic weekdays 0.325, Saturdays 0.116, Sundays 0.105, Saturdays and Sundays together 0.111; West South Central weekdays 0.299, Saturdays 0.135, Sundays 0.119, Saturdays and Sundays together 0.127 (EV WATTS, https://doi.org/10.15483/1970735). On a weekend day a work car charges at home with its weekend session; weekend charging at offices would move part of that energy from homes to commercial loads."

# Highest average speed of an NHTS driver trip, mph. build_nhts_extract.py makes a
# vehicle-day with a faster driver trip class (iv); it reads the typical value.
nhts_max_trip_speed_mph:
  typical: 85
  stress: 85
  source: "Insurance Institute for Highway Safety, Maximum posted speed limits (Texas rural interstates: 75; 80 or 85 on specified segments of road; State Highway 130 (portions toll) has a posted limit of 85 mph; every other state 80 or below; North Carolina 70): https://iihs.org/topics/speed/speed-limit-laws"
  assumption: "ASSUMPTION: a driver trip whose average speed, miles over clock duration plus one minute, exceeds 85 mph, the highest posted speed limit in the United States, is a recording error, and its vehicle-day leaves every draw pool as class iv; the one minute added to the duration covers clock times recorded to the whole minute, so a short trip is not flagged by rounding."
