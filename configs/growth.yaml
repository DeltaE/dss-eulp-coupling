# Load growth over planning years. One run is one planning year, growth_years years after the
# data year of the building curves. Tracked defaults: growth off. A growth.yaml in the folder
# given to run_case.py --settings holds only the keys it changes and is merged over this file.
# Every key path of that file must exist here, except under infill_share_metro and
# block_attach_buses, which take new keys. A list replaces the list of this file.
# The rules are in README.md, section "Load growth over planning years".

# Whole number of years, 0 or above. 0 is growth off: no growth output is written and every
# output equals a run without this file.
growth_years: 0

# The AEO case that gives all four rates below: low | moderate | high.
#   low      = AEO2026 Low Economic Growth case
#   moderate = AEO2026 Counterfactual Baseline case
#   high     = AEO2026 High Economic Growth case
case: moderate

# Rates, percent a year: the average annual change from 2025 to 2050 of each quantity.
# Source: U.S. EIA, Annual Energy Outlook 2026, Table 4 (Residential Sector Key Indicators)
# and Table 5 (Commercial Sector Key Indicators).
#   Counterfactual Baseline: https://www.eia.gov/Outlooks/Aeo/excel/aeotab4.xlsx and
#   https://www.eia.gov/Outlooks/Aeo/excel/aeotab5.xlsx (https://www.eia.gov/outlooks/aeo/tables_ref.php)
#   Low and High Economic Growth: https://www.eia.gov/outlooks/Aeo/excel/sidecases/lowmacro/aeotab4.xlsx,
#   .../lowmacro/aeotab5.xlsx, .../highmacro/aeotab4.xlsx, .../highmacro/aeotab5.xlsx
#   (https://www.eia.gov/outlooks/aeo/tables_side_xls.php)
# Derived values, each (value of 2050 / value of 2025) ^ (1 / 25) - 1, in percent:
#   households        = single-family + multifamily + mobile homes
#   use_per_household = residential gross end-use electricity consumption / households
#   floorspace        = total commercial floorspace
#   use_per_ft2       = (commercial gross end-use electricity consumption - data center servers)
#                       / total commercial floorspace
# Electricity for electric vehicle charging is a row of its own in both tables and is outside
# the gross end-use rows.
# One ResStock sample is one dwelling unit, so a home customer is one household and the
# household rate applies to the count of home customers: ResStock documentation, "One Row of
# Data Is Not One Real House",
# https://nrel.github.io/ResStock.github.io/docs/resources/explanations/One_Row_Data_House.html
# ASSUMPTION: each growth year applies the 2025 to 2050 average annual change on top of the
# data year of the building curves. The tables give no rate for the years before 2025; a run
# of 10 years moves home use by (1 + rate / 100) ^ 10, so another base period moves every
# factor and count.
# ASSUMPTION: the national rates stand for one circuit. The tables give no value below census
# division; a circuit that grows faster or slower than the country gets more or fewer new
# customers in proportion.
# ASSUMPTION: data centre servers are left out of use_per_ft2, because no ComStock building
# type is a data centre. They are 6.9 percent of commercial gross end-use electricity in 2025
# and 22.5 percent in 2050 in Table 5; with them the commercial use rate is above zero.
# ASSUMPTION: electric vehicle charging is left out of both use rates, because the EV layer of
# the pipeline adds it; with it every building factor would also carry EV growth.
# ASSUMPTION: the rates are rounded to two decimals. Rounding moves a rate by at most 0.005
# percent a year, so a factor at 10 years by at most 0.05 percent.
rate_cases:
  households:        {low: 0.67, moderate: 0.79, high: 0.82}
  use_per_household: {low: -0.30, moderate: -0.28, high: -0.25}
  floorspace:        {low: 0.84, moderate: 1.02, high: 1.20}
  use_per_ft2:       {low: -0.61, moderate: -0.65, high: -0.67}

# A number here replaces that rate of the case (percent a year); null keeps the case.
# ASSUMPTION: a rate set here is the caller's own value and has no source in this file.
rates:
  households: null
  use_per_household: null
  floorspace: null
  use_per_ft2: null

# Share of the new homes built as infill (copies of single customers inside the circuit); the
# rest arrive as extension blocks (copies of whole laterals). 1.0 | metro | national | a
# number from 0 to 1. metro takes the value of the run's topology_id in infill_share_metro.
# Source: U.S. EPA, Residential Construction Trends in America's Metropolitan Regions, 2012
# edition, Appendix A, share of new homes built as infill from 2000 to 2009:
# https://www.epa.gov/sites/production/files/2014-03/documents/residential_construction_trends.pdf
# 21 percent across 209 regions (range 1.7 to 79.7 percent), 25.0 percent in Greensboro-High
# Point, 7.0 percent in Austin-Round Rock-San Marcos.
# ASSUMPTION: the share of a metropolitan region applies to one circuit of that region. The
# report gives no value below the region; a circuit in a built-out district has a higher
# share, and its new homes then load existing transformers and secondaries more.
infill_share: 1.0
infill_share_metro:
  NC_GSO_urban_uhs13_1247: 0.250
  TX_AUS_urban_p2uhs12_1247: 0.070
infill_share_national: 0.21

# New businesses that come with the new homes: feeder | national | aeo.
#   feeder   = new homes x the circuit's businesses / the circuit's homes
#   national = new homes / (households_million / commercial_buildings_million)
#   aeo      = the circuit's businesses x the floorspace growth of the case
# Sources of the national ratio: 5.9 million commercial buildings in 2018, U.S. EIA,
# Commercial Buildings Energy Consumption Survey 2018,
# https://www.eia.gov/consumption/commercial/data/2018/pdf/CBECS_2018_Building_Characteristics_Flipbook.pdf
# and 127.6 million households in 2018, U.S. Census Bureau, series TTLHH,
# https://fred.stlouisfed.org/data/TTLHH
companions: feeder
companions_national:
  commercial_buildings_million: 5.9
  households_million: 127.6
# ComStock building types (in.comstock_building_type) never copied as a companion business.
# ASSUMPTION: a hospital or a school does not arrive with a few dozen new homes. A circuit
# with such a building keeps it and gains none; one is added by name in named_loads.
companion_excluded_types: [Hospital, PrimarySchool, SecondarySchool]

# Copies and blocks reuse the circuit's own elements. SMART-DS sized its lines and
# transformers with the Reference Network Model for peak planning loads:
# https://github.com/openEDI/documentation/tree/main/SMART-DS
# ASSUMPTION: a new customer or block has the line lengths, line codes and transformer ratings
# of the existing customer or lateral it copies, and its place is electrical: no street map is
# used. A new district with longer runs has lower voltages than its copy shows.

# Where extension blocks attach: feeder name: [bus, ...], three-phase medium-voltage buses,
# used in order before any drawn bearing.
block_attach_buses: {}

# Loads added by name. Each entry: {feeder, type, count, year, bus}. type is a ComStock
# building type; the load is present when year is at or below growth_years; bus is optional
# and must be a three-phase medium-voltage bus of the feeder. A named load is connected like
# the existing business of the nearest size. When that business sits behind a service
# transformer and no transformer of the feeder is large enough for the new load, the load
# connects at medium voltage: one new three-phase line from its bus to a new bus of its own.
named_loads: []
# Length in metres of that new line on a feeder that has no medium-voltage customer. A feeder
# that has one takes the median length of the lines that feed its own.
# ASSUMPTION: 269.0 m is the median length of the eight lines that feed the medium-voltage
# customers of SMART-DS feeders uhs13_1247--udt4015 and uhs13_1247--udt4819 (74 to 638 m). It
# is used on a feeder that has none; a longer line lowers the voltage at the new load.
# ASSUMPTION: the new line is overhead and takes the smallest three-phase medium-voltage
# LineCode of the feeder that carries the load. The SMART-DS Greensboro feeders serve their
# medium-voltage customers this way, each on a three-phase overhead line of the smallest
# three-phase medium-voltage overhead code of its feeder; a larger code raises the voltage at
# the new load a little.
# Source of the feeders: NREL, SMART-DS Synthetic Electrical Network Data OpenDSS Models for
# SFO, GSO, and AUS, Open Energy Data Initiative, https://data.openei.org/submissions/2981
named_load_mv_line_m: 269.0
# Bus of a named load without bus: seeded | strongest | weakest (lowest or highest
# positive-sequence impedance magnitude from the source bus along the path).
named_load_bus: seeded
# ASSUMPTION: a building new to the feeder draws reactive power at the constant ratio of kvar
# to kW of the SMART-DS load lines of the existing customer whose connection it copies, at
# every step. It has no SMART-DS load of its own to give a reactive power series; a hospital
# with a different power factor moves its kVA and the loading of its transformer.

# Factor of one named customer in place of its segment's factor. Each entry: {feeder, load,
# factor, peak_factor}. factor multiplies the customer's annual energy. With peak_factor
# (optional) the annual peak grows by peak_factor instead, and the curve is stretched
# linearly between the two.
# ASSUMPTION: a factor set here is the caller's own value and has no source in this file.
load_factors: []

# PV and storage of existing hosts under load growth. false: an existing host is sized on its
# building's annual electricity use without its growth factor, so it has the size of a run
# without growth. true: every host is sized on the use of the planning year (annual use x
# the host's factor; the roof limit is unchanged). A host among the new customers is sized
# on its own use in both cases: its building's annual use x its factor.
# ASSUMPTION: a system installed before the planning year keeps its size while its
# building's use changes. true fits a study where all systems are bought in the planning
# year; it moves every existing PV and storage size with the use rates.
der_resize_with_growth: false

# SMART-DS voltage regulators under load growth. A regulator is a transformer whose windings
# all have the same kV (README.md, section "Voltage regulators").
regulators:
  # with_control | never. with_control: a lateral that holds a regulator may be the template
  # of a block; the copy carries the regulator and every RegControl that names it, renamed
  # and on the new buses, each as the feeder writes it after the repairs. never: such a
  # lateral is never a block template.
  # ASSUMPTION: a block copied from a lateral that holds a regulator gets a regulator of the
  # same rating and settings, as every other element of a block copies its template. A new
  # district built without one has lower voltages beyond the regulator's place.
  block_copies: with_control
  # with_regulator | lines_only. The path impedance from the source bus to a bus, as
  # named_load_bus strongest and weakest and the column bus_impedance_ohm of
  # growth_named_loads.csv read it. with_regulator: each regulator on the path
  # adds the series reactance XHL / 100 x kV^2 x 1000 / kVA ohm, with kV and kVA of its first
  # winding as written. XHL is the percent reactance from winding 1 to winding 2 on the kVA
  # base of winding 1, with kV phase to phase for a three-phase transformer and the winding kV
  # otherwise: https://opendss.epri.com/Properties16.html . The conversion to ohm:
  # https://cimhub-opendss.readthedocs.io/en/latest/schema_ref/XHL/ . XHL is the value of
  # XHL or X12 of the statement, else the first value of XscArray, else 7, the OpenDSS
  # default: https://cimhub-opendss.readthedocs.io/en/latest/schema_ref/Xhl/ . 1000 is the SI
  # prefix kilo: https://www.bipm.org/en/measurement-units/si-prefixes . lines_only: a
  # regulator adds nothing.
  # ASSUMPTION: a regulator adds its leakage reactance only. Its winding resistance is left
  # out, which lowers the magnitude of the path impedance a little.
  path_impedance: with_regulator

# Planning limits of the grown circuit. They are reported in every run with growth on, and
# they tell network growth (below) when the network has to grow.
planning_limits:
  # repository | range_a | range_b | [low, high] in per unit. repository is voltage_band of
  # pipeline_config.yaml. The setting never changes the existing voltage summaries.
  voltage_band: repository
  # ANSI C84.1 service voltage on a 120 V base: Range A 114 to 126 V, Range B 110 to 127 V.
  # USDA Rural Utilities Service Bulletin 1724D-113, Table 1,
  # https://rd.usda.gov/sites/default/files/UEP_Bulletin_1724D-113.pdf ; Bulletin 1724D-114,
  # Table 2, https://www.rd.usda.gov/files/UEP_Bulletin_1724D-114.pdf ; Pacific Power, Power
  # Quality Standards 1C.2.1, Table 1,
  # https://www.pacificpower.net/content/dam/pcorp/documents/en/pp-rmp/power-quality-standards/1C_2_1_PF.pdf
  voltage_bands:
    range_a: [0.95, 1.05]
    range_b: [0.9167, 1.0583]
  # Percent of the rating. Lines against the normamps of their LineCode and transformers
  # against their kVA, 100 percent: Abraham and Ghosh, DISCO slides, NREL/PR-6A40-89565,
  # slides 13 to 15, https://nrel.gov/docs/fy24osti/89565.pdf . A second sourced line value is
  # 75 percent of the thermal rating as the planning rating of conductors: City of Riverside
  # Public Utilities, Distribution Design Manual, DDM-1 Feeder Systems, section 1.2 J,
  # https://www.tellusventure.com/downloads/riverside/DDM-1%20Feeder%20Systems%20.pdf
  line_limit_percent: 100
  transformer_limit_percent: 100
  # ASSUMPTION: the feeder head and the substation transformer take the same 100 percent of
  # their rating as lines and service transformers. A utility that keeps a reserve for
  # switching sets a lower value, and more circuits are then over their limit.
  head_limit_percent: 100
  substation_limit_percent: 100

# Network growth: the network grows with its load. Inside one run, after the solve of the
# grown circuit as built (round 0), the run tests the planning limits, applies one step and
# solves again, up to max_rounds times. Expansion is a new feeder from the substation;
# reinforcement is a rebuilt line or second circuits, a replaced or parallel service
# transformer, a line voltage regulator. Substation transformer units are added as records.
# The run reports what it built as quantities; it holds no costs. Nothing is drawn: the same
# inputs give the same outputs. The rules are in README.md, section "Network growth".
# Sources of the kinds of step and their order: NREL DISCO documentation, Upgrade Cost
# Analysis, https://natlabrockies.github.io/disco/analysis-workflows/upgrade-cost-analysis.html
# (thermal upgrades before voltage upgrades; a higher-rated item of similar configuration from
# a catalog, else similar equipment in parallel; a new regulator on a common upstream node of
# the buses with violations); City of Riverside Public Utilities, Distribution Design Manual,
# DDM-1 Feeder Systems, section 1.2 D (line regulators, reconductoring, load transfer and a new
# circuit as corrective actions) and sections 1.1 A and 1.2 E (sectionalizing and tie switches
# carry load transfers),
# https://www.tellusventure.com/downloads/riverside/DDM-1%20Feeder%20Systems%20.pdf
# ASSUMPTION: the steps run in the fixed order of steps, capacity before voltage, so the
# result is a rule-based plan and no least-cost plan. Another order builds other equipment.
# ASSUMPTION: the EV charging shapes and the battery schedules are set on the circuit as built
# (round 0) and kept in every round, so the load of a circuit is the same in every round and
# only the network changes. A controller that sees the grown network would shift charging a
# little.
network_growth:
  # "off" | planned | as_needed. "off": the planning limits are reported and nothing is
  # built. planned: only the items of carry_forward and planned are built. as_needed: those
  # items first, then what the planning limits still call for. Keep the quotes on "off": off
  # without quotes is a boolean in YAML. With growth_years 0 nothing of this block runs.
  mode: as_needed
  # The as-needed steps in their order; a step left out never runs.
  #   new_feeder: one express line from the substation bus to an open point, per round, for a
  #     head or a three-phase medium-voltage line over its limit with no larger LineCode.
  #   reconductor: every line over its limit takes a larger LineCode of the catalog, or
  #     second circuits.
  #   service_transformer: every transformer over its limit takes a larger rating of the
  #     catalog, or parallel units.
  #   regulator: one line voltage regulator per round for customers under the voltage band.
  # ASSUMPTION: the new feeder is one express line of the head's LineCode along the existing
  # route from the substation bus to the open point, and it serves nothing on the way. A real
  # route can be longer, and the voltage beyond the open point then lower.
  # ASSUMPTION: a line regulator is one single-phase two-winding transformer per phase with
  # XHL 0.01 and %LoadLoss 0.01, the values of the regulator of the IEEE 13 node test case
  # distributed with OpenDSS,
  # https://github.com/dss-extensions/electricdss-tst/blob/master/Version8/Distrib/IEEETestCases/13Bus/IEEE13Nodeckt.dss
  # with the ampacity of its line (on a line of 1 m or less, a switch, fuse or recloser, the
  # largest of that and the summed ampacity of each medium-voltage branch longer than 1 m at
  # either end of the line) and the vreg, band and ptratio of the substation regulator
  # of its SMART-DS topology, read from the substation folder in every run. A regulator with
  # line-drop compensation holds a different voltage downstream.
  steps: [new_feeder, reconductor, service_transformer, regulator]
  # true: before any other step, once per circuit, single-phase laterals are moved from the
  # heaviest to the lightest phase of the head. It builds nothing.
  # ASSUMPTION: a single-phase lateral can be moved to another phase at its tap with no change
  # to its lines or transformers. The rule moves whole laterals only and balances the head at
  # its peak step, so other steps of the window can end less balanced.
  rebalance_phases: false
  # Where a new feeder takes over: switch (an existing switch) | switch_then_bus (a switch,
  # else any three-phase medium-voltage bus) | bus.
  open_point: switch
  # How a head is tested against head_limit_percent: largest_phase (its largest phase current
  # over the normamps of its LineCode) | three_phase_kva (its kVA over normamps x base kV x
  # sqrt(3)).
  head_metric: largest_phase
  # New and rebuilt equipment is sized so that the peak that called for it is at most this
  # percent of its rating. 75: line and transformer design loading of 0.75 per unit, NREL
  # DISCO documentation, Upgrade Cost Analysis (above); 75 percent of the thermal rating as
  # the planning rating of conductors, Riverside DDM-1, section 1.2 J (above).
  sizing_percent: 75
  # Rounds of as-needed steps after round 0, a whole number, 0 or above. 5: the upgrade
  # iteration threshold of NREL DISCO, Upgrade Cost Analysis (above).
  max_rounds: 5
  # The SMART-DS feeder folders whose LineCodes and transformer ratings a step may use:
  # region (every feeder folder under the folder that holds the topology's substation
  # folder) | substation (the feeder folders of the substation folder) | feeder (the
  # circuit's own feeder).
  # ASSUMPTION: a LineCode name with _OH_ is overhead and one with _UG_ underground, as
  # SMART-DS names them; a line is rebuilt only with a code of its own phases, voltage level
  # and construction. A feeder with other names gets second circuits where a larger code
  # would do.
  catalog: region
  # Path of a network_growth_built.yaml of an earlier planning year or of the other season of
  # the same case (absolute, or relative to the settings folder), or null. Its items for the
  # same feeder and mix are built first, after round 0.
  carry_forward: null
  # Items in the format of network_growth_built.yaml, built after those of carry_forward. An
  # item may give mix: all.
  # ASSUMPTION: an item given here is the caller's own plan and has no source in this file.
  planned: []
# Substation units: substation_limits.csv records how many transformer units the substation
# needs. The power flow is unchanged.
# ASSUMPTION: a new substation unit copies the largest transformer of the substation folder
# and takes the same substation_limit_percent and sizing_percent. The substation transformer
# is in no solved circuit, so its losses and its regulator are outside the power flow.
