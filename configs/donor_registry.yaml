# Available EULP donor-profile states (the "donor menu").
# donor_state drives EULP metadata filtering, profile matching/downloading,
# and CSV generation -> sets PIPELINE_STATE.
# The parquet pool comes from the topology: run_case.py derives it from smart_ds_relpath
# (or parquet_relpath) in topology_registry.yaml.

donors:
  NC:
    donor_state: NC
    eulp_download_date: "20250330"
    residential_metadata: "residential_data_SELECT_STATES.csv"
    commercial_metadata: "commercial_data_SELECT_STATES.csv"
    status: ready

  TX:
    donor_state: TX
    eulp_download_date: "20250330"
    residential_metadata: "residential_data_SELECT_STATES.csv"
    commercial_metadata: "commercial_data_SELECT_STATES.csv"
    status: ready
