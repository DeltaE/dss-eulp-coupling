# Layer-wide defaults shared by every case.

# Seasons run for EVERY case (matches the tested setup).
seasons:
  - summer
  - winter
# shoulder seasons are To Be Tested and intentionally left unwired:
# shoulder: [spring, fall]   # TBT

# Deterministic instantiation phase order (the proven fire-test sequence).
# Skips 0_experimental_design (LHS, downstream) and stops before Phase 7 (DER, downstream).
# Full deterministic chain including scenario variants (dm, uncontrolled).
# Phases marked run_once in phases.yaml execute on the first season only.
# Phase 6 kvar loadshapes land alongside the kW CSVs in 5c_csv_conversion;
# intermediate pkls land in 6_kvar_preparation. See docs/instantiation_management.md.
phase_order: [pre, "1", "2", "3", "4", "5a", "5b", "5d", "5b_variants", "5c", "5c_variants", "6", "6_variants", "7a", "7b", "7c", "8"]

# Environment applied to every phase.
base_env:
  PYTHONIOENCODING: "utf-8"
