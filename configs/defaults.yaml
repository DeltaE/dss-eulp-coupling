# Layer-wide defaults shared by every case.

# Seasons run for EVERY case (matches the tested setup).
seasons:
  - summer
  - winter
# shoulder seasons are To Be Tested and intentionally left unwired:
# shoulder: [spring, fall]   # TBT

# Deterministic instantiation phase order (the proven fire-test sequence).
# --all runs pre to 8 for each selected season. It does not run Phase 0 (0_experimental_design). Phase 7a copies the tracked mixes_lhs.json into the workspace.
# Full deterministic chain including scenario variants (dm, uncontrolled).
# Phase 6 kvar loadshapes land alongside the kW CSVs in 5c_csv_conversion;
# intermediate pkls land in 6_kvar_preparation. See docs/instantiation_management.md.
phase_order: [pre, "1", "2", "3", "4", "5a", "5b", "5d", "5b_variants", "5c", "5c_variants", "6", "6_variants", "7a", "7b", "7c", "8"]

# Mixes file that Phase 7a copies into the workspace (repo-relative or absolute).
mixes_file: 0_experimental_design/mixes_lhs.json

# Environment applied to every phase.
base_env:
  PYTHONIOENCODING: "utf-8"
  # Backstop only, not the fix: the real determinism fix is the sha256-based
  # seed offset in instantiate_circuits_and_runs_APPLYFILTER.py (Task 0). This
  # just neutralizes any other unaudited hash()-on-str/bytes call that PYTHONHASHSEED
  # randomization would otherwise make process-dependent.
  PYTHONHASHSEED: "0"
