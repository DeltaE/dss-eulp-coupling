clusters:
  paper3_baseline:
    states: [MI, MT, VT, WA]
    mode: baseline_from_folders
    residential_folder_groups: [residential_tmy3]
    commercial_folder_groups: [commercial_amy2018]
    residential_upgrades: [baseline]
    commercial_upgrades: [baseline]
    output_residential: residential_data_SELECT_STATES_MI_MT_VT_WA.csv
    output_commercial: commercial_data_SELECT_STATES_MI_MT_VT_WA.csv
    validation_historical_residential: residential_data_SELECT_STATES_MI_MT_VT_WA.csv
    validation_historical_commercial: commercial_data_SELECT_STATES_MI_MT_VT_WA.csv
  canadian_proxy:
    states: [MI, VT, WA, MT, MN]
    mode: historical_slice
    historical_residential: residential_data.csv
    historical_commercial: commercial_data.csv
    output_residential: residential_data_SELECT_STATES_MI_VT_WA_MT_MN.csv
    output_commercial: commercial_data_SELECT_STATES_MI_VT_WA_MT_MN.csv
    validation_historical_residential: residential_data_SELECT_STATES_MI_VT_WA_MT_MN.csv
    validation_historical_commercial: commercial_data_SELECT_STATES_MI_VT_WA_MT_MN.csv
