version: 1

paths:
  data_raw: data_raw
  historical_data: data_derived/historical
  outputs: outputs

download_stage:
  status: recovered_from_legacy_scripts
  policy: cache_first_fallback_only
  note: Local reproduction reads the copied CSVs in data_raw. Redownloading is a slow fallback used only when cached source folders are missing or need to be rebuilt.
  recovered_from:
    - scripts_legacy/download_residential_metadata.py
    - scripts_legacy/download_residential_metadata_2.py
    - scripts_legacy/download_commercial_metadata.py
    - scripts_legacy/download_commercial_metadata_19_20.py
    - scripts_legacy/pds_database_address.txt
  viewer_base_url: https://data.openei.org/s3_viewer?bucket=oedi-data-lake&prefix=nrel-pds-building-stock%2Fend-use-load-profiles-for-us-building-stock%2F
  query_year: 2024
  metadata_path: metadata_and_annual_results/by_state
  recovered_downloads:
    residential_tmy3:
      release: resstock_tmy3_release_2
      folder_group: residential_tmy3
      legacy_script: scripts_legacy/download_residential_metadata.py
      upgrades: [baseline, upgrade01, upgrade02, upgrade03, upgrade04]
    residential_amy2018:
      release: resstock_amy2018_release_2
      folder_group: residential_amy2018
      legacy_script: scripts_legacy/download_residential_metadata_2.py
      upgrades: [baseline, upgrade01, upgrade02, upgrade03, upgrade04]
    commercial_amy2018:
      release: comstock_amy2018_release_1
      folder_group: commercial_amy2018
      legacy_script: scripts_legacy/download_commercial_metadata.py
      upgrades: [baseline, upgrade01, upgrade02, upgrade03, upgrade08, upgrade09]
    commercial_amy2018_late_upgrades:
      release: comstock_amy2018_release_1
      folder_group: commercial_amy2018_late_upgrades
      legacy_script: scripts_legacy/download_commercial_metadata_19_20.py
      upgrades: [upgrade19, upgrade20]

folder_groups:
  residential_tmy3:
    dataset: residential
    folder_pattern: Metadata_{state}_Residential
    release: resstock_tmy3_release_2
  residential_amy2018:
    dataset: residential
    folder_pattern: Metadata_{state}_Residential_2
    release: resstock_amy2018_release_2
  commercial_amy2018:
    dataset: commercial
    folder_pattern: Metadata_{state}_Commercial
    release: comstock_amy2018_release_1
  commercial_amy2018_late_upgrades:
    dataset: commercial
    folder_pattern: Metadata_{state}_Commercial_2
    release: comstock_amy2018_release_1

